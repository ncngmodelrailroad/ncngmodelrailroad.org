name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # a11y tooling is kept out of package.json so it never slows the deploy
      # build; install pinned versions only for this job.
      - name: Install accessibility tooling
        run: npm install --no-save playwright@1.61.1 @axe-core/playwright@4.12.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WCAG 2.1 AA audit
        run: npm run a11y
