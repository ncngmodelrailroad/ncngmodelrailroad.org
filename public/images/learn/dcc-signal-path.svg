<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">How a DCC system fits together</title>
  <desc id="d">A throttle sends commands to the command station, which passes them to the booster. The booster powers the track, and a decoder inside each locomotive reads the commands. All-in-one starter systems combine the throttle, command station, and booster.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f7f3ee; stroke: #8A1F17; stroke-width: 2; }
    .name { fill: #1f1a17; font-size: 18px; font-weight: 700; }
    .sub { fill: #4a4440; font-size: 14px; }
    .arrow { stroke: #8A1F17; stroke-width: 2.5; fill: none; }
    .head { fill: #8A1F17; }
    .brace { stroke: #2F5D46; stroke-width: 2; fill: none; }
    .note { fill: #2F5D46; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #26262b; stroke: #F87171; }
      .name { fill: #f4f4f5; }
      .sub { fill: #c4c4cc; }
      .arrow { stroke: #F87171; }
      .head { fill: #F87171; }
      .brace { stroke: #4ADE80; }
      .note { fill: #4ADE80; }
    }
  </style>
  <rect class="bg" width="560" height="440" rx="12"/>
  <g>
    <rect class="box" x="20" y="20" width="360" height="64" rx="10"/>
    <text class="name" x="40" y="48">Throttle (cab)</text>
    <text class="sub" x="40" y="70">You choose a locomotive, speed, and lights</text>

    <rect class="box" x="20" y="104" width="360" height="64" rx="10"/>
    <text class="name" x="40" y="132">Command station</text>
    <text class="sub" x="40" y="154">The brain: turns your input into commands</text>

    <rect class="box" x="20" y="188" width="360" height="64" rx="10"/>
    <text class="name" x="40" y="216">Booster</text>
    <text class="sub" x="40" y="238">The muscle: adds power to the commands</text>

    <rect class="box" x="20" y="272" width="360" height="64" rx="10"/>
    <text class="name" x="40" y="300">Track</text>
    <text class="sub" x="40" y="322">Carries power and commands together</text>

    <rect class="box" x="20" y="356" width="360" height="64" rx="10"/>
    <text class="name" x="40" y="384">Decoder in the locomotive</text>
    <text class="sub" x="40" y="406">Obeys only commands for its address</text>
  </g>
  <g>
    <path class="arrow" d="M200 84 V98"/><path class="head" d="M193 96 L200 104 L207 96 Z"/>
    <path class="arrow" d="M200 168 V182"/><path class="head" d="M193 180 L200 188 L207 180 Z"/>
    <path class="arrow" d="M200 252 V266"/><path class="head" d="M193 264 L200 272 L207 264 Z"/>
    <path class="arrow" d="M200 336 V350"/><path class="head" d="M193 348 L200 356 L207 348 Z"/>
  </g>
  <path class="brace" d="M396 24 Q408 24 408 36 V124 Q408 136 420 136 Q408 136 408 148 V236 Q408 248 396 248"/>
  <text class="note" x="428" y="118">Often one box</text>
  <text class="note" x="428" y="136">in starter sets,</text>
  <text class="note" x="428" y="154">like a Power Cab</text>
</svg>
