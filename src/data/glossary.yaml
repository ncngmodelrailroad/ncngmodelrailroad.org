# Glossary terms shown on /learn/glossary.
#
# To add a term, copy one block below and change the words. Each block needs:
#   id:         a short label, lowercase with hyphens (also used for the link anchor)
#   term:       the word, in quotes
#   definition: the explanation, in quotes
#   category:   exactly one of:
#               Scale & Gauge | Trains & Equipment | Building & Detailing | Track & Operating
#
# Keep the leading "- " and the two-space indentation. Order within a category
# follows the order here.

# --- Scale & Gauge ---

- id: scale
  term: "Scale"
  definition: "How much smaller a model is than the real thing. Our layout is O scale, or 1:48, so one foot on the model stands in for 48 real feet."
  category: Scale & Gauge

- id: gauge
  term: "Gauge"
  definition: "The distance between the two running rails. It comes from the real railroad being modeled and is separate from scale."
  category: Scale & Gauge

- id: narrow-gauge
  term: "Narrow gauge"
  definition: "Track laid closer together than the standard width. The Nevada County Narrow Gauge used rails 3 feet apart, which was cheaper to build and could bend around tight curves in the Sierra foothills."
  category: Scale & Gauge

- id: standard-gauge
  term: "Standard gauge"
  definition: "The most common track width in North America, 4 feet 8.5 inches between the rails."
  category: Scale & Gauge

- id: on3
  term: "On3"
  definition: "Our scale. The O stands for O scale (1:48), and n3 means narrow gauge at 3 scale feet, so On3 is an O-scale model of a 3-foot narrow gauge railroad like the N.C.N.G."
  category: Scale & Gauge

- id: o-scale
  term: "O scale"
  definition: "A model scale of 1:48. Larger and heavier than the popular HO and N scales, with room for fine detail."
  category: Scale & Gauge

- id: ho-scale-and-n-scale
  term: "HO scale and N scale"
  definition: "Two of the most common starter scales. HO is 1:87 and N is 1:160, both smaller than the O scale we use, so a whole railroad fits in less space."
  category: Scale & Gauge

# --- Trains & Equipment ---

- id: locomotive
  term: "Locomotive"
  definition: "The powered engine that pulls or pushes a train. It may be steam, diesel, or, on small narrow gauge lines, a gas engine."
  category: Trains & Equipment

- id: motive-power
  term: "Motive power"
  definition: "A railroad term for its locomotives taken as a group."
  category: Trains & Equipment

- id: rolling-stock
  term: "Rolling stock"
  definition: "The cars that get pulled along the line: boxcars, flatcars, gondolas, passenger coaches, and the caboose."
  category: Trains & Equipment

- id: prototype
  term: "Prototype"
  definition: "The real-life railroad, locomotive, or scene that a model is based on. The Nevada County Narrow Gauge is our prototype."
  category: Trains & Equipment

- id: roster
  term: "Roster"
  definition: "The list of locomotives a railroad owned. You can see our engine roster on the Trains page."
  category: Trains & Equipment

- id: wheel-arrangement-whyte-notation
  term: "Wheel arrangement (Whyte notation)"
  definition: "A shorthand for a steam locomotive's wheels, such as 2-6-0, which counts the leading wheels, then the large driving wheels, then the trailing wheels."
  category: Trains & Equipment

- id: geared-locomotive-shay-heisler-climax
  term: "Geared locomotive (Shay, Heisler, Climax)"
  definition: "A slow, powerful steam engine geared for steep, rough mining and logging track. Engines like the Heisler and Climax worked in the Nevada County area."
  category: Trains & Equipment

- id: caboose
  term: "Caboose"
  definition: "The crew car at the tail end of a freight train."
  category: Trains & Equipment

- id: truck
  term: "Truck"
  definition: "The swiveling frame that holds a set of wheels under each end of a car or locomotive."
  category: Trains & Equipment

- id: coupler
  term: "Coupler"
  definition: "The mechanism that links one car to the next."
  category: Trains & Equipment

# --- Building & Detailing ---

- id: layout
  term: "Layout"
  definition: "The model railroad itself: the benchwork, track, scenery, and structures where the trains run."
  category: Building & Detailing

- id: benchwork
  term: "Benchwork"
  definition: "The wood or metal framework that holds up a layout."
  category: Building & Detailing

- id: scratchbuilding
  term: "Scratchbuilding"
  definition: "Building a model from raw materials such as wood, brass, or styrene instead of from a kit."
  category: Building & Detailing

- id: kitbashing
  term: "Kitbashing"
  definition: "Combining or modifying kits to make something new or more accurate to the prototype."
  category: Building & Detailing

- id: weathering
  term: "Weathering"
  definition: "Adding paint, chalk, and washes so a clean model looks realistically used, with rust, soot, dust, and fading."
  category: Building & Detailing

# --- Track & Operating ---

- id: dcc-digital-command-control
  term: "DCC (Digital Command Control)"
  definition: "A control system that sends digital signals through the rails so each locomotive can be driven on its own, with working lights and sound, even when several share the same track. Our layout runs on DCC."
  category: Track & Operating

- id: turnout-switch
  term: "Turnout (switch)"
  definition: "The movable section of track that lets a train change from one route to another."
  category: Track & Operating

- id: ballast
  term: "Ballast"
  definition: "The crushed rock packed around and between the ties to hold the track in place and help it drain."
  category: Track & Operating

- id: grade
  term: "Grade"
  definition: "How steeply the track climbs or descends, given as a percent."
  category: Track & Operating

- id: staging
  term: "Staging"
  definition: "Hidden tracks at the edge of a layout that stand in for the rest of the world, where trains wait their turn to come on stage."
  category: Track & Operating

- id: consist
  term: "Consist"
  definition: "The makeup of a train: the particular locomotives and cars coupled together for a run."
  category: Track & Operating
