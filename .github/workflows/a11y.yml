name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=22.23.4 <23"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # a11y tooling is kept out of package.json so it never slows the deploy
      # build; install pinned versions only for this job.
      - name: Install accessibility tooling
        run: npm install --no-save playwright@1.64.1 @axe-core/playwright@4.14.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Uses local map assets with third-party requests blocked. SwiftShader
      # provides WebGL on headless runners; no GPU or live tile service needed.
      - name: Run WCAG 2.1 AA audit and browser regressions
        run: npm run a11y
